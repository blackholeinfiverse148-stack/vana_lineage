# ==============================================================================
# BHIV VANA Lineage Viewer — Local / Development Compose
# ==============================================================================

services:
  vana-lineage:
    build:
      context: .
      dockerfile: Dockerfile
    image: bhiv/vana-lineage:latest
    container_name: bhiv_vana_lineage
    restart: unless-stopped
    ports:
      - "5179:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vana_network

networks:
  vana_network:
    driver: bridge
